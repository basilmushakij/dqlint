[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dataqual"
version = "0.1.0"
description = "A data quality checker CLI for CSV/Excel/JSON/Parquet, with a terminal summary and an HTML dashboard"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "basilmushakij" }]
dependencies = [
    "pandas>=1.5",
    "rich>=13.0",
    "click>=8.0",
    "openpyxl>=3.0",
]

[project.scripts]
dataqual = "dataqual.cli:main"

[tool.setuptools.packages.find]
include = ["dataqual*"]
