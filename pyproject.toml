[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dqlint"
version = "0.2.0"
description = "A lightweight CLI for factual first-look dataset inspection"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "basilmushakij" }]
dependencies = ["pandas>=1.5"]

[project.optional-dependencies]
excel = ["openpyxl>=3.0"]
parquet = ["pyarrow>=10.0"]
dev = ["pytest>=7.0", "ruff>=0.6"]

[project.scripts]
dqlint = "dataqual.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"] # Embedded deterministic HTML keeps long template lines readable.

[tool.setuptools.packages.find]
include = ["dataqual*"]
